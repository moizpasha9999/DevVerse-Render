<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Automation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
            min-height:100vh;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        #loader-screen{
            display:none;
            height:100vh;
        }

        .loader-text{
            font-size:1.2rem;
            font-weight:500;
            color:#555;
            transition:.3s;
        }
    </style>
</head>
<body>

<div class="container py-5" id="form-screen">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card p-4">

                <h2 class="text-center mb-4">
                    Google Maps Automation
                </h2>

                <form id="automationForm">

                    <div class="mb-3">
                        <label class="form-label">
                            Profession
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="profession"
                                placeholder="E.g: Restaurant"
                                required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            City / Location
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="location"
                                placeholder="E.g: Toronto"
                                required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Number of Results
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                id="limit"
                                min="1"
                                placeholder = "E.g: 10"
                                required>
                    </div>

                    <button class="btn btn-primary w-100">
                        Start Automation
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Loader -->

<div id="loader-screen"
     class="d-flex flex-column justify-content-center align-items-center">

    <div class="spinner-border text-primary"
         style="width:5rem;height:5rem;"
         role="status">
    </div>

    <h4 class="mt-4">
        Starting Automation...
    </h4>

    <p class="loader-text mt-2" id="loader-message">
        Preparing browser...
    </p>

</div>


<script>
let parsed_data = [];
const messages = [

    "Preparing browser...",
    "Launching Chrome...",
    "Try to relax",
    "Please be patient...",
    "Go for a walk maybe",
    "Almost there...",
    "Take a sip of water",
    "Maybe you should sit down",
    "Take deep breaths"

];

let messageInterval;

const loaderMessage =
document.getElementById("loader-message");


document
.getElementById("automationForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    document.getElementById("form-screen").style.display="none";
    document.getElementById("loader-screen").style.display="flex";

    let i=0;

    messageInterval=setInterval(()=>{

        i=(i+1)%messages.length;
        loaderMessage.innerText=messages[i];

    },2500);


    const payload={

        category:document.getElementById("profession").value,
        location:document.getElementById("location").value,
        limit:Number(document.getElementById("limit").value)

    };

    try{

        const response=await fetch("/projects/google_maps_bot/",{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "X-CSRFToken":getCookie("csrftoken")
            },

            body:JSON.stringify(payload)

        });

        clearInterval(messageInterval);

        if(response.ok){

            loaderMessage.innerText="Completed.";

            const data=await response.json();

            if (data.status == 'success'){
                        parsed_data = data.result;
                        document.body.innerHTML = `
            <div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center bg-light">
                <div class="text-center p-5 shadow-sm bg-white rounded">
                    <h1 class="display-4 text-success mb-3">Successfully imported data</h1>
                    <p class="lead mb-4 text-muted">Your data has been processed and is ready for use.</p>
                    <button 
                    onclick="download_excel()" 
                    class="btn btn-primary btn-lg px-4">
                    Download as Excel sheet
                    </button>
                </div>
            </div>
        `;
            }
            else {
                  document.body.innerHTML = `
            <div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center bg-light">
                <div class="text-center p-5 shadow-sm bg-white rounded">
                    <h1 class="display-4 text-danger mb-3">An Error Occured, reload and try again</h1>
                </div>
            </div>
        `;
            }

            // Redirect or display results here.

        }else{

            document.body.innerHTML = `
            <div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center bg-light">
                <div class="text-center p-5 shadow-sm bg-white rounded">
                    <h1 class="display-4 text-danger mb-3">An Error Occured, reload and try again</h1>
                </div>
            </div>
        `;

        }

    }catch(err){

        clearInterval(messageInterval);

        loaderMessage.innerText="Unable to connect to server.";

        console.error(err);

    }

});

 function download_excel() {

        fetch('/projects/download_excel/', { 
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                "X-CSRFToken":getCookie("csrftoken"),

            },
            body: JSON.stringify(parsed_data) /* add any required post data here */ }).then(async response => {
    const blob = await response.blob();

    const disposition = response.headers.get("Content-Disposition");
    let filename = "results.xlsx";

    if (disposition) {
        const match = disposition.match(/filename="?([^"]+)"?/);
        if (match) {
            filename = match[1];
        }
    }

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);
});
        }

function getCookie(name){

    let cookieValue=null;

    if(document.cookie && document.cookie!==""){

        const cookies=document.cookie.split(";");

        for(let cookie of cookies){

            cookie=cookie.trim();

            if(cookie.startsWith(name+"=")){

                cookieValue=decodeURIComponent(cookie.substring(name.length+1));

                break;

            }

        }

    }

    return cookieValue;

}


</script>

</body>
</html>
