    <style>
        :root {
            --primary: #0d6efd;
            /* general UI variables (will be overridden by body[data-theme]) */
            --bg: #0d1114;
            --surface-glass: rgba(255,255,255,0.06);
            --surface-strong: rgba(255,255,255,0.09);
            --muted: rgba(255,255,255,0.7);
            --muted-2: rgba(255,255,255,0.5);
            --neon: rgba(13,110,253,0.12);
            --glow: 0 0 10px rgba(13,110,253,0.6), 0 0 20px rgba(13,110,253,0.4);
            --text: #e6eef8;
            --glass-border: rgba(255,255,255,0.05);
            --card-shadow: 0 6px 30px rgba(2,6,23,0.6);
        }

        /* LIGHT THEME */
        body[data-theme='light'] {
            --bg: #ffffff;
            --surface-glass: rgba(15,23,42,0.03);
            --surface-strong: rgba(15,23,42,0.05);
            --muted: #6b7280; /* gray-500 */
            --muted-2: #9ca3af;
            --neon: rgba(13,110,253,0.06);
            --glow: 0 6px 18px rgba(2,6,23,0.06);
            --text: #1f2937;
            --glass-border: rgba(15,23,42,0.04);
            --card-shadow: 0 6px 24px rgba(15,23,42,0.06);
        }

        /* DARK THEME */
        body[data-theme='dark'] {
            --bg: linear-gradient(180deg,#071019 0%, #0d1114 100%);
            --surface-glass: rgba(255,255,255,0.04);
            --surface-strong: rgba(255,255,255,0.06);
            --muted: rgba(207,239,251,0.9);
            --muted-2: rgba(207,239,251,0.7);
            --neon: rgba(13,110,253,0.12);
            --glow: 0 0 12px rgba(13,110,253,0.65), 0 0 26px rgba(13,110,253,0.35);
            --text: #e6eef8;
            --glass-border: rgba(255,255,255,0.05);
            --card-shadow: 0 6px 30px rgba(2,6,23,0.6), var(--glow);
        }

        /* page basics */
        html, body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background .25s,color .25s;
        }

        .text-muted {
            color: var(--muted-2) !important;
        }

        /* scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(13,110,253,0.18);
            border-radius: 8px
        }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(13,110,253,0.32)
            }

        
        /* MAIN */
        .main {
            margin-left: 260px;
            padding: 28px;
            transition: margin-left .28s ease;
        }

          .main {
            margin-left: 72px;
        }

        /* GLASS CARDS */
        .glass {
            background: var(--surface-glass);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--glass-border);
            transition: box-shadow .2s ease, transform .2s ease;
        }

            .glass:hover {
                box-shadow: 0 10px 40px rgba(2,6,23,0.12), var(--glow);
            }

        /* PROJECT CARD hover */
        .project-card {
            transform-style: preserve-3d;
            transition: transform .45s cubic-bezier(.2,.9,.2,1), box-shadow .25s;
            overflow: hidden;
            border-radius: 12px;
            border: 0;
            background: transparent;
        }

            .project-card:hover {
                transform: translateY(-8px) rotateX(4deg) rotateY(6deg);
                box-shadow: var(--card-shadow);
            }

        /* chart container to avoid scrollbar & overflow issues */
        .chart-wrap {
            position: relative;
            height: 220px;
            overflow: hidden;
            border-radius: 10px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* small screens */
        @media (max-width:991px) {
            .sidebar {
                left: -300px;
            }

                .sidebar.show {
                    left: 0;
                }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .sidebar-toggle {
                display: none;
            }
        }

        /*theme toggle*/
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 30px;
            background: #e6e6e6;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            cursor: pointer;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background 0.4s;
        }

            .theme-toggle .icon {
                font-size: 14px;
                transition: color 0.4s;
                z-index: 2;
            }

                .theme-toggle .icon.sun {
                    color: #f1c40f;
                }

                .theme-toggle .icon.moon {
                    color: #666;
                }

            .theme-toggle .toggle-ball {
                position: absolute;
                width: 24px;
                height: 24px;
                background: white;
                border-radius: 50%;
                left: 4px;
                transition: all 0.4s ease;
                z-index: 1;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }

        body.dark-theme .theme-toggle {
            background: #333;
        }

            body.dark-theme .theme-toggle .icon.sun {
                color: #555;
            }

            body.dark-theme .theme-toggle .icon.moon {
                color: #f1c40f;
            }

        body.dark-theme .toggle-ball {
            transform: translateX(30px);
            background: #222;
        }
    </style>
    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>
</head>

<body class="dark-theme" data-theme="light" data-aos-easing="ease" data-aos-duration="700" data-aos-delay="0">





    <div class="app">
        <!-- SIDEBAR -->
        <!-- MAIN -->
        <main id="main" class="main" style="margin-left: 260px;">
            <!--Theme Toggle-->
            <div class="theme-toggle" id="themeToggle">
                <i class="bi bi-sun-fill icon sun"></i>
                <i class="bi bi-moon-fill icon moon"></i>
                <div class="toggle-ball" id="toggleBall" style="transform: translateX(0px);"></div>
            </div>

            <!-- Sections -->
            <section id="homeSection" class="section">

                <div class="d-flex justify-content-between header">
                    <div class="d-flex">

                        <img src="{{ p.postbox.profile_picture }}"
                             class="rounded-circle me-2"
                             style="height:50px; width:50px;">

                        <div>
                            <strong style="display:block;">{{ p.postbox.user }}</strong>

                        </div>



                    </div>
                    <button class="btn btn-outline-secondary btn-sm mb-3 backMain"

                    </button>

                </div>

                        <p class="mt-2">{{ p.payload }}</p>

                        <img src="{{ p.image }}" class="img-fluid rounded mb-2">
                        {% endif %}

                            <span onclick="toggleCommentBox({{ p.id }})">

                            {% for c in p.comments %}
                            <div class="small mt-1">
                                @{{ c.creater }}: {{ c.content }}
                            </div>
                            {% endfor %}

                        </div>

         

                 
</section>
            {% include 'profiles/base.html' %}
          
            


            <!-- Scripts (keep AOS, theme toggle, sidebar, tooltips, charts; remove sign-out login logic) -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
            <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
            <script>
                //AOS.init({ duration: 700, once: true });
                function getCookie(name) {
                    let cookies = [];

                    // Step 1: Check if any cookies exist
                    if (document.cookie) {
                        // Step 2: Split cookie string into individual cookies
                        cookies = document.cookie.split('; ');
                    }

                    // Step 3: Go through each cookie
                    for (let i = 0; i < cookies.length; i++) {
                        // Step 4: Split one cookie into [key, valueParts...]
                        const parts = cookies[i].split('=');
                        const key = parts[0];           // the cookie name
                        const valueParts = parts.slice(1); // everything after the first '='

                        // Step 5: If this cookie name matches the one we're looking for
                        if (key === name) {
                            // Step 6: Join value parts back together and decode
                            const value = valueParts.join('=');
                            return decodeURIComponent(value);
                        }
                    }

                    // Step 7: If no match found, return null
                    return null;
                }
                //Use base.html to get the profile_data in order to updte this line
               
                function returnHome() {
                    window.location.href = window.location.origin + "/home"

                }
                


                function edit_posts(post) {
                    fetch(String(window.location.origin) + `/posts/edit/?user_name=${JSON.parse(localStorage.getItem("profile")).user_name}&password=${JSON.parse(localStorage.getItem("profile")).password}`, {
                        method: "PATCH",
                        headers: {
                            'Content-Type': "application/json",
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify(post)

                    }).then((response) => {
                        if (response.status === 200) {
                            let data = response.json();
                            data.then((data) => {
                                if (data["message"] == "Unauthenticated") {
                                    window.location.href = "/sign-in/";
                                }
                                else if (data["message"] == "Successful") {

                                    if (Object.hasOwn(post, 'pinned')) {
                                        get_posts();
                                    }
                                    else if (Object.hasOwn(post, 'action')) {
                                        document.getElementById(`post-${post.id}`).remove();
                                    }
                                    else if (Object.hasOwn(post, 'shares')) {
                                        let shares = Number((document.getElementById(`share${post.id}`).innerHTML).at(-1))
                                        document.getElementById(`share${post.id}`).innerHTML = `🔁 ${shares + 1}`;
                                    }
                                    else if (Object.hasOwn(post, 'comment')) {

                                        el = document.getElementById(`comments-${post.id}`);
                                        const div = document.createElement("div");
                                        div.className = "small mt-1";
                                        div.textContent = `@${post.user_name}: ${post.comment}`;
                                        el.appendChild(div);
                                      
                                    }
                                    console.log(data);
                                }
                            })
                        }

                    });
                }

                function likePost(id) {

                    fetch(String(window.location.origin) + `/posts/like_post?user_name=${JSON.parse(localStorage.getItem("profile")).user_name}&post_id=${id}`).then((response) => {
                        let data = response.json();
                        data.then((data) => {
                            if (data["message"] == "Liked successfuly") {

                                document.querySelector(`#like${id}`).innerHTML = `❤️ ${data["likes"]}`;

                            }
                        });
                    })


                }

                let toBase64 = (str) => {
                    const bytes = new TextEncoder().encode(str);
                    let binary = '';
                    bytes.forEach(b => binary += String.fromCharCode(b));
                    return btoa(binary);
                }
                function sharePost(id) {
                    let link = window.location.origin + "/posts/post/" + String(id) + `?viewer=${toBase64(JSON.parse(localStorage.getItem("profile")).user_name)}`;
                    localStorage.setItem("message", link);
                    let shares = 1;
                    edit_posts({ id: id, shares: shares });
                    window.location.href = window.location.origin + "/messages/";


                }

                function toggleCommentBox(id) {
                    console.log(id);
                    const el = document.getElementById("comments-" + id);
                    el.style.display = el.style.display === "none" ? "block" : "none";
                }

                function addComment(e, id) {
                    if (e.key !== "Enter" || !e.target.value.trim()) return;
                    edit_posts({ id: id, comment: e.target.value, user_name: JSON.parse(localStorage.getItem("profile")).user_name });
                    e.target.value = "";
                }

                </script>
