<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Verification | DevVerse</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #f8f9fa;
            --overlay-color: rgba(255,255,255,0.85);
            --card-bg: #ffffff;
            --heading-color: #212529;
            --text-color: #495057;
            --input-bg: #ffffff;
            --navbar-bg: #ffffff;
            --light-bg-img: url('assets/Light Background theme picture.png');
            --dark-bg-img: url('assets/Dark Background theme picture.png');
            --glow: 0 0 10px rgba(13,110,253,0.6), 0 0 20px rgba(13,110,253,0.4);
        }

        body.dark-theme {
            --bg-color: #121212;
            --overlay-color: rgba(0,0,0,0.75);
            --card-bg: #1e1e1e;
            --heading-color: #ffffff;
            --text-color: #cccccc;
            --input-bg: #2a2a2a;
            --navbar-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: var(--light-bg-img);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.6s, color 0.6s, background-image 0.6s ease-in-out;
            font-family: "Inter", sans-serif;
            min-height: 100vh;
        }

            body.dark-theme {
                background-image: var(--dark-bg-img);
            }

        .overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-color);
            backdrop-filter: blur(3px);
            z-index: -1;
            transition: background 0.6s;
        }

        .verification-card {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 25px rgba(0,0,0,0.15) var(--glow);
            max-width: 450px;
            width: 100%;
            transition: background 0.4s, color 0.4s, box-shadow 0.4s;
        }

        body.dark-theme .verification-card {
            animation: glowing 3s ease-in-out infinite alternate;
        }

        @keyframes glowing {
            0% {
                box-shadow: 0 0 5px rgba(13,110,253,0.3), 0 0 10px rgba(13,110,253,0.2);
            }

            50% {
                box-shadow: 0 0 15px rgba(13,110,253,0.6), 0 0 25px rgba(13,110,253,0.4);
            }

            100% {
                box-shadow: 0 0 10px rgba(13,110,253,0.5), 0 0 20px rgba(13,110,253,0.3);
            }
        }

        .btn-outline-primary {
            border-radius: 8px;
            border-color: var(--primary-color);
            color: var(--primary-color);
            transition: all 0.3s, box-shadow 0.3s;
        }

        body.dark-theme .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
            box-shadow: var(--glow);
        }

        .theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 30px;
            background: #e6e6e6;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            cursor: pointer;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background 0.4s;
        }

            .theme-toggle .icon {
                font-size: 14px;
                transition: color 0.4s;
                z-index: 2;
            }

                .theme-toggle .icon.sun {
                    color: #f1c40f;
                }

                .theme-toggle .icon.moon {
                    color: #666;
                }

            .theme-toggle .toggle-ball {
                position: absolute;
                width: 24px;
                height: 24px;
                background: white;
                border-radius: 50%;
                left: 4px;
                transition: all 0.4s ease;
                z-index: 1;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }

        body.dark-theme .theme-toggle {
            background: #333;
        }

            body.dark-theme .theme-toggle .icon.sun {
                color: #555;
            }

            body.dark-theme .theme-toggle .icon.moon {
                color: #f1c40f;
            }

        body.dark-theme .toggle-ball {
            transform: translateX(30px);
            background: #222;
        }

        .verification-icon {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        small, p, h5, h2 {
            color: var(--heading-color);
            transition: color 0.4s;
        }

        a {
            text-decoration: none;
        }

            a:hover {
                text-decoration: underline;
            }
    </style>
</head>
</html>

<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle" id="themeToggle">
        <i class="bi bi-sun-fill icon sun"></i>
        <i class="bi bi-moon-fill icon moon"></i>
        <div class="toggle-ball"></div>
    </div>
    <section class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="verification-card text-center" data-aos="fade-up" data-aos-delay="100">

            <!-- Icon -->
            <div class="verification-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <!-- Title -->
            <h2 class="fw-bold mb-3">Reset Your Password</h2>

            <p class="mb-4">
                Enter your new password below. Make sure it's strong and easy for you to remember.
            </p>

            <!-- New Password -->
            <div class="input-group mb-3">
                <input type="password"
                       class="form-control text-center border-primary newPassword"
                       placeholder="New Password" id="password" />
                <span class="input-group-text" style="cursor: pointer;" onclick="togglePassword('password','eyeIcon' )">
                    <i id="eyeIcon" class="bi bi-eye-slash"></i>
                </span>
            </div>

            <!-- Confirm Password -->
            <div class="input-group mb-3">
                <input type="password"
                       class="form-control text-center border-primary  confirmPassword"
                       placeholder="Confirm New Password" id="password-re"/>
                <span class="input-group-text" style="cursor: pointer;" onclick="togglePassword('password-re', 'eyeIcon-re')">
                    <i id="eyeIcon-re" class="bi bi-eye-slash"></i>
                </span>
            </div>
            <!-- Message / Confirmation -->
            <div class="alert alert-warning mb-2 mt-1 resetMessage d-none" role="alert">
                <!-- Dynamic message here -->
            </div>

            <!-- Reset Button -->
            <button class="btn btn-outline-primary px-3 py-2 resetBtn" onclick="reset_password()">
                Reset Password
            </button>

            <!-- Extra Note -->
            <p class="mt-4 mb-0 resetMessage">
                Make sure your password is at least 8 characters long and includes numbers and symbols.
            </p>

        </div>
    </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init({ duration: 900, once: false, offset: 120 });

    const toggle = document.getElementById("themeToggle");
    const body = document.body;
    toggle.addEventListener("click", () => {
        body.classList.toggle("dark-theme");
    });
    function togglePassword(password_input, eye_icon) {
        const passwordInput = document.getElementById(password_input);
        const eyeIcon = document.getElementById(eye_icon);

        if (passwordInput.type === "password") {
            // Show password
            passwordInput.type = "text";
            eyeIcon.classList.remove("bi-eye-slash");
            eyeIcon.classList.add("bi-eye");
        } else {
            // Hide password
            passwordInput.type = "password";
            eyeIcon.classList.remove("bi-eye");
            eyeIcon.classList.add("bi-eye-slash");
        }
    }
    function update_profile(payload) {
        fetch(String(window.location.origin) + "/profile/", {
            method: "PATCH",
            headers: {
                'Content-Type': "application/json",
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)

        }).then((response) => {
            if (response.status === 200) {
                let data = response.json();
                data.then((data) => {
                    console.log(data);
                    if (data["status"] == "successful") {
                        window.location.href = "/sign-in/";
                    }
                    else {
                        console.log("Error");
                    }
                });
            }

        });
    }
    function reset_password() {
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("password-re").value.trim();
        const messageBox = document.querySelector(".resetMessage");

        // Reset message box
        messageBox.classList.remove("d-none", "alert-success", "alert-warning");
        messageBox.classList.add("alert-warning");

        // 1. Empty field check
        if (!password || !confirmPassword) {
            messageBox.textContent = "Please fill in both password fields.";
            messageBox.classList.remove("d-none");
            return false;
        }

        // 2. Password match check
        if (password !== confirmPassword) {
            messageBox.textContent = "Passwords do not match.";
            messageBox.classList.remove("d-none");
            return false;
        }

        // 3. Password strength check (basic)
        if (password.length < 8) {
            messageBox.textContent = "Password must be at least 8 characters long.";
            messageBox.classList.remove("d-none");
            return false;
        }

        // 4. Success
        messageBox.classList.remove("alert-warning");
        messageBox.classList.add("alert-success");
        messageBox.textContent = "Password is valid. Processing reset...";
        messageBox.classList.remove("d-none");

        // 5. OUTPUT values (you can send to backend here)
        console.log("New Password:", password);
        console.log("Confirm Password:", confirmPassword);

        // Example: return data for API usage
        update_profile({
            old_user_name: JSON.parse(localStorage.getItem("profile")).user_name,
            password: password
        });
    }
    function getCookie(name) {
        let cookies = [];

        // Step 1: Check if any cookies exist
        if (document.cookie) {
            // Step 2: Split cookie string into individual cookies
            cookies = document.cookie.split('; ');
        }

        // Step 3: Go through each cookie
        for (let i = 0; i < cookies.length; i++) {
            // Step 4: Split one cookie into [key, valueParts...]
            const parts = cookies[i].split('=');
            const key = parts[0];           // the cookie name
            const valueParts = parts.slice(1); // everything after the first '='

            // Step 5: If this cookie name matches the one we're looking for
            if (key === name) {
                // Step 6: Join value parts back together and decode
                const value = valueParts.join('=');
                return decodeURIComponent(value);
            }
        }

        // Step 7: If no match found, return null
        return null;
    }
</script>
