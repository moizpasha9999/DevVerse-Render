<style>
    /* SIDEBAR */
    .sidebar {
        width: 260px;
        background: var(--surface-glass);

        padding: 22px 12px;
        position: fixed;
        inset: 0 auto 0 0;

        transition: width .28s ease, left .28s ease, box-shadow .28s ease;
        overflow-y: auto;
        border-right: 1px solid var(--glass-border);
    }

        .sidebar.collapsed {
            width: 72px;
        }

    .brand {
        font-weight: 700;
        font-size: 18px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
    }

    .sidebar .nav-link {
        color: inherit;
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all .22s ease;
        text-decoration: none;
    }

        .sidebar .nav-link .label {
            white-space: nowrap;
            transition: opacity .18s, transform .18s;
        }

    .sidebar.collapsed .nav-link .label {
        opacity: 0;
        transform: translateX(-10px);
        pointer-events: none;
    }

    .sidebar .nav-link:hover, .sidebar .nav-link.active {
        background: var(--neon);
        color: var(--text);
        box-shadow: var(--glow);
    }

    .sidebar-toggle {

        right: -18px;

        height: 36px;
        border-radius: 12px;
        display: flex;
        align-items: center;

        cursor: pointer;
        background: var(--surface-strong);
        transition: transform .18s;
        border: 1px solid var(--glass-border);
        box-shadow: var(--glow);
    }

    .sidebar.collapsed .sidebar-toggle {
        right: -14px;
        transform: rotate(180deg);
    }

    }

</style>

<script>
    


    // Sidebar collapse behavior with persistence
    const sidebar = document.getElementById('sidebar');
    const collapseBtn = document.getElementById('collapseBtn');
    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }
    // Load previous collapsed state
    if (localStorage.getItem('devv_sidebar_collapsed') === '1') {
        sidebar.classList.add('collapsed');
        collapseBtn.innerHTML = '<i class="bi bi-chevron-right"></i>';
        collapseBtn.setAttribute('aria-pressed', 'true');
        document.querySelector(".main").style.marginLeft = "72px";
        document.querySelector(".lowerDiv").style.left = "-10px";
        document.querySelector(".lowerDetails").style.visibility = "hidden";
        document.querySelector(".devVerseicon").style.visibility = "hidden";

    } else {
        collapseBtn.innerHTML = '<i class="bi bi-chevron-left"></i>';
        collapseBtn.setAttribute('aria-pressed', 'false');
        document.querySelector(".main").style.marginLeft = "260px";
        document.querySelector(".lowerDiv").style.left = "0px";
        document.querySelector(".lowerDetails").style.visibility = "visible";
        document.querySelector(".devVerseicon").style.visibility = "visible";


    }

    collapseBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        const isCollapsed = sidebar.classList.contains('collapsed');
        collapseBtn.innerHTML = "";
        collapseBtn.innerHTML = isCollapsed ? '<i class="bi bi-chevron-right"></i>' : '<i class="bi bi-chevron-left"></i>';
        collapseBtn.setAttribute('aria-pressed', String(isCollapsed));
        // persist
        localStorage.setItem('devv_sidebar_collapsed', isCollapsed ? '1' : '0');
        // ensure tooltips still work when collapsed (bootstrap tooltips remain bound)
        if (isCollapsed) {
            document.querySelector(".main").style.marginLeft = "72px";
            document.querySelector(".lowerDiv").style.left = "-10px";
            document.querySelector(".devVerseicon").style.visibility = "hidden";
            document.querySelector(".lowerDetails").style.visibility = "hidden";



        } else {
            document.querySelector(".main").style.marginLeft = "260px";
            document.querySelector(".lowerDiv").style.left = "0px";
            document.querySelector(".devVerseicon").style.visibility = "visible";
            document.querySelector(".lowerDetails").style.visibility = "visible";





        }

    });


    

    // Theme toggle: persist and update CSS variables + update charts colors
    const themeToggle = document.getElementById('themeToggle');
    const toggleBall = document.getElementById('toggleBall');
    const body = document.body;

    function applyTheme(theme) {
        body.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', (theme === 'light') ? 'light' : 'dark');

        // move toggle ball visually
        if (theme === 'dark') { toggleBall.style.transform = 'translateX(27px)'; }
        else { toggleBall.style.transform = 'translateX(0)'; }

        localStorage.setItem('devv_theme', theme);
    }

    // init from localStorage
    const savedTheme = localStorage.getItem('devv_theme');
    if (savedTheme === 'light') applyTheme('light'); else applyTheme('dark');

    themeToggle.addEventListener('click', () => {
        const current = (body.getAttribute('data-theme') === 'light') ? 'light' : 'dark';
        applyTheme(current === 'light' ? 'dark' : 'light');
    });

    // small helper for loader spin
    (function addSpinKeyframe() {
        const style = document.createElement('style');
        style.innerHTML = '@keyframes spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(style);
    })();
</script>
<script>

    let lowerProfileName = document.getElementById("lowerProfileName");
    let lowerJobTitle = document.getElementById("lowerjobTitle");
    let LowerProfilePic = document.getElementById("lowerProfilePic");
    function getCookie(name) {
        let cookies = [];

        // Step 1: Check if any cookies exist
        if (document.cookie) {
            // Step 2: Split cookie string into individual cookies
            cookies = document.cookie.split('; ');
        }

        // Step 3: Go through each cookie
        for (let i = 0; i < cookies.length; i++) {
            // Step 4: Split one cookie into [key, valueParts...]
            const parts = cookies[i].split('=');
            const key = parts[0];           // the cookie name
            const valueParts = parts.slice(1); // everything after the first '='

            // Step 5: If this cookie name matches the one we're looking for
            if (key === name) {
                // Step 6: Join value parts back together and decode
                const value = valueParts.join('=');
                return decodeURIComponent(value);
            }
        }

        // Step 7: If no match found, return null
        return null;
    }
    let first_name = "";

                            }
                            catch {
                                console.log("hahahah");

                            }
                            console.log(profile_data);
                            update_data(profile_data);
                            
                        }
                        else if (data["message"] == "Email not verified") {

                        }

                        }

</script>
