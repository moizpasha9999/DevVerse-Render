<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | DevVerse</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- AOS CSS -->
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
    :root {
        --primary-color: #0d6efd;
        --bg-color: #f8f9fa;
        --overlay-color: rgba(255,255,255,0.85);
        --card-bg: #ffffff;
        --heading-color: #212529;
        --text-color: #495057;
        --input-bg: #ffffff;
        --light-bg-img: url('assets/Light Background theme picture.png');
        --dark-bg-img: url('assets/Dark Background theme picture.png');
        --glow: 0 0 10px rgba(13,110,253,0.6), 0 0 20px rgba(13,110,253,0.4);
    }

    body.dark-theme {
        --bg-color: #121212;
        --overlay-color: rgba(0,0,0,0.75);
        --card-bg: #1e1e1e;
        --heading-color: #ffffff;
        --text-color: #cccccc;
        --input-bg: #2a2a2a;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        background-image: var(--light-bg-img);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        transition: background-color 0.6s, color 0.6s, background-image 0.6s ease-in-out;
        font-family: "Inter", sans-serif;
        min-height: 100vh;
    }

    body.dark-theme { background-image: var(--dark-bg-img); }

    .overlay {
        position: fixed;
        inset: 0;
        background: var(--overlay-color);
        backdrop-filter: blur(2px);
        z-index: -1;
        transition: background 0.6s;
    }

    .card {
        border: none;
        border-radius: 12px;
        background: var(--card-bg);
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        transition: background 0.4s, color 0.4s, box-shadow 0.4s;
    }

    body.dark-theme .card {
        animation: glowing 3s ease-in-out infinite alternate;
    }

    @keyframes glowing {
        0% { box-shadow: 0 0 5px rgba(13,110,253,0.3), 0 0 10px rgba(13,110,253,0.2); }
        50% { box-shadow: 0 0 15px rgba(13,110,253,0.6), 0 0 25px rgba(13,110,253,0.4); }
        100% { box-shadow: 0 0 10px rgba(13,110,253,0.5), 0 0 20px rgba(13,110,253,0.3); }
    }

    .form-control {
        border-radius: 8px;
        background-color: var(--input-bg);
        color: var(--text-color);
        border: 1px solid #ced4da;
        transition: background 0.4s, color 0.4s;
    }

    .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.25);
    }

    h3, label, small {
        color: var(--heading-color);
        transition: color 0.4s;
    }

    .btn-outline-primary {
        border-radius: 8px;
        border-color: var(--primary-color);
        color: var(--primary-color);
        transition: all 0.3s, box-shadow 0.3s;
    }

    body.dark-theme .btn-outline-primary:hover {
        background-color: var(--primary-color);
        color: white;
        box-shadow: var(--glow);
    }

    .theme-toggle {
        position: fixed;
        bottom: 20px; left: 20px;
        width: 60px; height: 30px;
        background: #e6e6e6;
        border-radius: 30px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 5px 8px; cursor: pointer;
        overflow: hidden; z-index: 10;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background 0.4s;
    }

    .theme-toggle .icon { font-size: 14px; transition: color 0.4s; z-index:2; }
    .theme-toggle .icon.sun { color: #f1c40f; }
    .theme-toggle .icon.moon { color: #666; }
    .theme-toggle .toggle-ball {
        position: absolute; width: 24px; height: 24px; background: white;
        border-radius: 50%; left: 4px; transition: all 0.4s ease; z-index:1;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    body.dark-theme .theme-toggle { background: #333; }
    body.dark-theme .theme-toggle .icon.sun { color: #555; }
    body.dark-theme .theme-toggle .icon.moon { color: #f1c40f; }
    body.dark-theme .toggle-ball { transform: translateX(30px); background: #222; }
    .cursor-pointer {
        cursor: pointer;
    }
</style>
</head>
<body>
<div class="overlay"></div>

<!-- Theme Toggle -->
<div class="theme-toggle" id="themeToggle">
  <i class="bi bi-sun-fill icon sun"></i>
  <i class="bi bi-moon-fill icon moon"></i>
  <div class="toggle-ball"></div>
</div>

<!-- Login Form -->
<div class="container d-flex align-items-center justify-content-center min-vh-100" data-aos="fade-up" data-aos-delay="100">
  <div class="card p-4" style="max-width: 420px; width: 100%;">
    <h3 class="text-center mb-3 fw-bold">Welcome Back</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="user_name" class="form-label">Username</label>
        <input type="text" id="user_name" class="form-control" placeholder="Enter your username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            <span class="input-group-text" style="cursor: pointer;" onclick="togglePassword()">
                <i id="eyeIcon" class="bi bi-eye-slash"></i>
            </span>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a  class="small text-decoration-none cursor-pointer" id="forgotPassword">Forgot password?</a>
      </div>
      <div class="alert alert-warning mb-1 mt-1 message d-none" role="alert">

      </div>
      <div class="d-grid">
        <button type="button" class="btn btn-outline-primary rounded-pill" id="loginBtn" onclick="login_Button()" >Login</button>
      </div>
    </form>
    <div class="text-center mt-3">
      <small>Don't have an account? <a href="{% url 'sign-up' %}" class="text-decoration-none">Sign Up</a></small>
    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init({ duration: 900, once: true, offset: 120 });

const toggle = document.getElementById("themeToggle");
toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-theme");
});
    document.getElementById("forgotPassword").addEventListener("click", () => {
        localStorage.setItem("reset-password", true);
        window.location.href = "/Email-Verification/";
        
    })

    // Optional: simulate login using localStorage for demo
    function getCookie(name) {
        let cookies = [];

        // Step 1: Check if any cookies exist
        if (document.cookie) {
            // Step 2: Split cookie string into individual cookies
            cookies = document.cookie.split('; ');
        }

        // Step 3: Go through each cookie
        for (let i = 0; i < cookies.length; i++) {
            // Step 4: Split one cookie into [key, valueParts...]
            const parts = cookies[i].split('=');
            const key = parts[0];           // the cookie name
            const valueParts = parts.slice(1); // everything after the first '='

            // Step 5: If this cookie name matches the one we're looking for
            if (key === name) {
                // Step 6: Join value parts back together and decode
                const value = valueParts.join('=');
                return decodeURIComponent(value);
            }
        }

        // Step 7: If no match found, return null
        return null;
    }
</script>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        if (passwordInput.type === "password") {
            // Show password
            passwordInput.type = "text";
            eyeIcon.classList.remove("bi-eye-slash");
            eyeIcon.classList.add("bi-eye");
        } else {
            // Hide password
            passwordInput.type = "password";
            eyeIcon.classList.remove("bi-eye");
            eyeIcon.classList.add("bi-eye-slash");
        }
    }
    function redirect_profile() {
        if (localStorage.getItem("profile")) {
            let profile = JSON.parse(localStorage.getItem("profile"));
            fetch(window.location.origin + "/redirect_profile/", {
                method: "POST",
                headers: {
                    'Content-Type': "application/json",
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(profile)
            }).then((response) => {
                if (response.status == 200) {
                    console.log("hey");
                    let data = response.json()
                    data.then((data) => {
                        document.querySelector(".message").classList.remove("d-none");
                        document.querySelector(".message").innerHTML = data["message"];

                        console.log(data["message"]);
                        if (data["message"] == "Redirecting") {
                            window.location.href = "/dashboard/"
                            document.querySelector(".message").classList.add("d-none");

                        }
                        else if(data["message"] == "Email not verified"){
                            window.location.href = "/Email-Verification/";
                            document.querySelector(".message").classList.add("d-none");

                        }
                        else {
                            return false;
                        }
                    })
                    
                }
            });
        }
        }
    function login_Button(){
        console.log("Hey started");
        let user_name = document.querySelector("#user_name").value; 
        let password = document.querySelector("#password").value;
        localStorage.setItem("profile", JSON.stringify({ user_name: user_name, password: password }));
        redirect_profile();
    }
</script>
</body>
</html>
