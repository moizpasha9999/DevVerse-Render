<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Verification | DevVerse</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-color: #f8f9fa;
      --overlay-color: rgba(255,255,255,0.85);
      --card-bg: #ffffff;
      --heading-color: #212529;
      --text-color: #495057;
      --input-bg: #ffffff;
      --navbar-bg: #ffffff;
      --light-bg-img: url('assets/Light Background theme picture.png');
      --dark-bg-img: url('assets/Dark Background theme picture.png');
      --glow: 0 0 10px rgba(13,110,253,0.6), 0 0 20px rgba(13,110,253,0.4);
    }

    body.dark-theme {
      --bg-color: #121212;
      --overlay-color: rgba(0,0,0,0.75);
      --card-bg: #1e1e1e;
      --heading-color: #ffffff;
      --text-color: #cccccc;
      --input-bg: #2a2a2a;
      --navbar-bg: #1a1a1a;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      background-image: var(--light-bg-img);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background-color 0.6s, color 0.6s, background-image 0.6s ease-in-out;
      font-family: "Inter", sans-serif;
      min-height: 100vh;
    }

    body.dark-theme { background-image: var(--dark-bg-img); }

    .overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-color);
      backdrop-filter: blur(3px);
      z-index: -1;
      transition: background 0.6s;
    }

    .verification-card {
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 25px rgba(0,0,0,0.15) var(--glow);
      max-width: 450px;
      width: 100%;
      transition: background 0.4s, color 0.4s, box-shadow 0.4s;
    }

    body.dark-theme .verification-card {
      animation: glowing 3s ease-in-out infinite alternate;
    }

    @keyframes glowing {
      0% { box-shadow: 0 0 5px rgba(13,110,253,0.3), 0 0 10px rgba(13,110,253,0.2); }
      50% { box-shadow: 0 0 15px rgba(13,110,253,0.6), 0 0 25px rgba(13,110,253,0.4); }
      100% { box-shadow: 0 0 10px rgba(13,110,253,0.5), 0 0 20px rgba(13,110,253,0.3); }
    }

    .btn-outline-primary {
      border-radius: 8px;
      border-color: var(--primary-color);
      color: var(--primary-color);
      transition: all 0.3s, box-shadow 0.3s;
    }

    body.dark-theme .btn-outline-primary:hover {
      background-color: var(--primary-color);
      color: white;
      box-shadow: var(--glow);
    }

    .theme-toggle {
      position: fixed;
      bottom: 20px; left: 20px;
      width: 60px; height: 30px;
      background: #e6e6e6;
      border-radius: 30px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 8px; cursor: pointer;
      overflow: hidden; z-index: 10;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background 0.4s;
    }

    .theme-toggle .icon { font-size: 14px; transition: color 0.4s; z-index: 2; }
    .theme-toggle .icon.sun { color: #f1c40f; }
    .theme-toggle .icon.moon { color: #666; }
    .theme-toggle .toggle-ball {
      position: absolute; width: 24px; height: 24px; background: white;
      border-radius: 50%; left: 4px; transition: all 0.4s ease; z-index:1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    body.dark-theme .theme-toggle { background: #333; }
    body.dark-theme .theme-toggle .icon.sun { color: #555; }
    body.dark-theme .theme-toggle .icon.moon { color: #f1c40f; }
    body.dark-theme .toggle-ball { transform: translateX(30px); background: #222; }

    .verification-icon { font-size: 3.5rem; color: var(--primary-color); margin-bottom: 1rem; }
    small, p, h5, h2 { color: var(--heading-color); transition: color 0.4s; }
    a { text-decoration: none; }
    a:hover { text-decoration: underline; }

    
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Theme Toggle -->
  <div class="theme-toggle" id="themeToggle">
    <i class="bi bi-sun-fill icon sun"></i>
    <i class="bi bi-moon-fill icon moon"></i>
    <div class="toggle-ball"></div>
  </div>

  <!-- Verification Section -->
  <section class="container d-flex justify-content-center align-items-center min-vh-100">
      <div class="verification-card text-center" data-aos="fade-up" data-aos-delay="100">
          <div class="verification-icon">
              <i class="bi bi-envelope-check-fill"></i>
          </div>
          <h2 class="fw-bold mb-3">Verify Your Email</h2>
          <p class="mb-4">
              We’ve sent a verification code to your email address. Please check your inbox and enter the code to verify your account.
          </p>
          <input type="text" class="form-control  text-center border-primary codeEntry mb-3" placeholder="Enter the code" />
          <div class="alert alert-warning mb-1 mt-1 message d-none" role="alert">

          </div>
        <button class="btn btn-outline-primary  px-3 py-2 verifyBtn" onclick="verify_code()">Verify</button>

          <p class="mt-4 mb-2">
              Didn’t receive the email? Check your spam folder or <a href="#" style="color: var(--primary-color);">contact support</a>.
          </p>
          <button class="btn btn-outline-primary  px-3 py-2 resendBtn">
              Resend Verification Code
          </button>
          
      </div>
  </section>


  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 900, once: false, offset: 120 });

    const toggle = document.getElementById("themeToggle");
    const body = document.body;
    toggle.addEventListener("click", () => {
      body.classList.toggle("dark-theme");
    });
  </script>
  <script>
      function getCookie(name) {
          let cookies = [];

          // Step 1: Check if any cookies exist
          if (document.cookie) {
              // Step 2: Split cookie string into individual cookies
              cookies = document.cookie.split('; ');
          }

          // Step 3: Go through each cookie
          for (let i = 0; i < cookies.length; i++) {
              // Step 4: Split one cookie into [key, valueParts...]
              const parts = cookies[i].split('=');
              const key = parts[0];           // the cookie name
              const valueParts = parts.slice(1); // everything after the first '='

              // Step 5: If this cookie name matches the one we're looking for
              if (key === name) {
                  // Step 6: Join value parts back together and decode
                  const value = valueParts.join('=');
                  return decodeURIComponent(value);
              }
          }

          // Step 7: If no match found, return null
          return null;
      }
      function verify_email() {
          let profile_details = JSON.parse(localStorage.getItem("profile"));
          console.log(profile_details);
          //localStorage.removeItem("profile");
          fetch(window.location.origin + "/email_authentication/", {
              method: "POST",
              headers: {
                  'Content-Type': "application/json",
                  'X-CSRFToken': getCookie('csrftoken')
              },
              body: JSON.stringify(profile_details)
          }).then((response) => {

              if (response.status == 200) {
                  data = response.json()
                  data.then((data) => {
                      if (data["verified"] == true) {
                          window.location.href = '/sign-in/'

                      }
                  });
              }
          });
      }

      verify_email();
      document.querySelector(".resendBtn").addEventListener("click", () => {
          verify_email();
          document.querySelector(".message").classList.remove("d-none");
          document.querySelector(".message").innerHTML= "Email sent, try again."
      });

      
      function verify_code() {
          fetch(window.location.origin + "/email-verification-link/", {
              method: "POST",
              headers: {
                  'Content-Type': "application/json",
                  'X-CSRFToken': getCookie('csrftoken')
              },
              body: JSON.stringify({
                  "code": document.querySelector(".codeEntry").value, "user_name": JSON.parse(localStorage.getItem("profile")).user_name
              })
          }).then((response) => {
              console.log("reached1");

              if (response.status == 200) {
                  let data = response.json();
                  data.then((data) => {
                      const message = data["message"];
                      document.querySelector(".message").classList.remove("d-none");
                      document.querySelector(".message").innerHTML = message;
                      if (message == "Redirecting to profile page") {
                          document.querySelector(".message").classList.add("d-none");

                          window.location.href = '/sign-in/'
                      }
                  })
              }
          });
      }
  </script>
</body>
</html>
