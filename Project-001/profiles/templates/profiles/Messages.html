<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DevVerse</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --primary: #0d6efd;
            /* general UI variables (will be overridden by body[data-theme]) */
            --bg: #0d1114;
            --surface-glass: rgba(255,255,255,0.06);
            --surface-strong: rgba(255,255,255,0.09);
            --muted: rgba(255,255,255,0.7);
            --muted-2: rgba(255,255,255,0.5);
            --neon: rgba(13,110,253,0.12);
            --glow: 0 0 10px rgba(13,110,253,0.6), 0 0 20px rgba(13,110,253,0.4);
            --text: #e6eef8;
            --glass-border: rgba(255,255,255,0.05);
            --card-shadow: 0 6px 30px rgba(2,6,23,0.6);
        }

        /* LIGHT THEME */
        body[data-theme='light'] {
            --bg: #ffffff;
            --surface-glass: rgba(15,23,42,0.03);
            --surface-strong: rgba(15,23,42,0.05);
            --muted: #6b7280; /* gray-500 */
            --muted-2: #9ca3af;
            --neon: rgba(13,110,253,0.06);
            --glow: 0 6px 18px rgba(2,6,23,0.06);
            --text: #1f2937;
            --glass-border: rgba(15,23,42,0.04);
            --card-shadow: 0 6px 24px rgba(15,23,42,0.06);
        }

        /* DARK THEME */
        body[data-theme='dark'] {
            --bg: linear-gradient(180deg,#071019 0%, #0d1114 100%);
            --surface-glass: rgba(255,255,255,0.04);
            --surface-strong: rgba(255,255,255,0.06);
            --muted: rgba(207,239,251,0.9);
            --muted-2: rgba(207,239,251,0.7);
            --neon: rgba(13,110,253,0.12);
            --glow: 0 0 12px rgba(13,110,253,0.65), 0 0 26px rgba(13,110,253,0.35);
            --text: #e6eef8;
            --glass-border: rgba(255,255,255,0.05);
            --card-shadow: 0 6px 30px rgba(2,6,23,0.6), var(--glow);
        }

        /* page basics */
        html, body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background .25s,color .25s;
        }

        .text-muted {
            color: var(--muted-2) !important;
        }

        /* scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(13,110,253,0.18);
            border-radius: 8px
        }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(13,110,253,0.32)
            }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--surface-glass);
            backdrop-filter: blur(8px);
            padding: 22px 12px;
            position: fixed;
            inset: 0 auto 0 0;
            box-shadow: var(--card-shadow);
            transition: width .28s ease, left .28s ease, box-shadow .28s ease;
            overflow-y: auto;
            border-right: 1px solid var(--glass-border);
        }

            .sidebar.collapsed {
                width: 72px;
            }

        .brand {
            font-weight: 700;
            font-size: 18px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .sidebar .nav-link {
            color: inherit;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all .22s ease;
            text-decoration: none;
        }

            .sidebar .nav-link .label {
                white-space: nowrap;
                transition: opacity .18s, transform .18s;
            }

        .sidebar.collapsed .nav-link .label {
            opacity: 0;
            transform: translateX(-10px);
            pointer-events: none;
        }

        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: var(--neon);
            color: var(--text);
            box-shadow: var(--glow);
        }

        .sidebar-toggle {
            position: absolute;
            top: 14px;
            right: -18px;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: var(--surface-strong);
            transition: transform .18s;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glow);
        }

        .sidebar.collapsed .sidebar-toggle {
            right: -14px;
            transform: rotate(180deg);
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            padding: 28px;
            transition: margin-left .28s ease;
        }

        .sidebar.collapsed + .main {
            margin-left: 72px;
        }

        /* GLASS CARDS */
        .glass {
            background: var(--surface-glass);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--glass-border);
            transition: box-shadow .2s ease, transform .2s ease;
        }

            .glass:hover {
                box-shadow: 0 10px 40px rgba(2,6,23,0.12), var(--glow);
            }

        /* PROJECT CARD hover */
        .project-card {
            transform-style: preserve-3d;
            transition: transform .45s cubic-bezier(.2,.9,.2,1), box-shadow .25s;
            overflow: hidden;
            border-radius: 12px;
            border: 0;
            background: transparent;
        }

            .project-card:hover {
                transform: translateY(-8px) rotateX(4deg) rotateY(6deg);
                box-shadow: var(--card-shadow);
            }

        /* chart container to avoid scrollbar & overflow issues */
        .chart-wrap {
            position: relative;
            height: 220px;
            overflow: hidden
            border-radius: 10px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* small screens */
        @media (max-width:991px) {
            .sidebar {
                left: -300px;
            }

                .sidebar.show {
                    left: 0;
                }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .sidebar-toggle {
                display: none;
            }
        }

        /*theme toggle*/
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 30px;
            background: #e6e6e6;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            cursor: pointer;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background 0.4s;
        }

            .theme-toggle .icon {
                font-size: 14px;
                transition: color 0.4s;
                z-index: 2;
            }

                .theme-toggle .icon.sun {
                    color: #f1c40f;
                }

                .theme-toggle .icon.moon {
                    color: #666;
                }

            .theme-toggle .toggle-ball {
                position: absolute;
                width: 24px;
                height: 24px;
                background: white;
                border-radius: 50%;
                left: 4px;
                transition: all 0.4s ease;
                z-index: 1;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }

        body.dark-theme .theme-toggle {
            background: #333;
        }

            body.dark-theme .theme-toggle .icon.sun {
                color: #555;
            }

            body.dark-theme .theme-toggle .icon.moon {
                color: #f1c40f;
            }

        body.dark-theme .toggle-ball {
            transform: translateX(30px);
            background: #222;
        }
        /* ================================
           FULL SCREEN MESSENGER FIX
        ================================ */
        #messagesSection {
            height: 100vh;
            display: flex;
            margin: -28px; /* cancels .main padding */
        }
        

        .messenger {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
        }

        /* ================================
                LEFT CHAT LIST
                ================================ */
        .chat-list {
            width: 300px;
            height: 100%;
            display: flex;


            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            overflow-y: auto;
        }

        /* SEARCH BAR */
        .chat-search {
            margin: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 999px;
            background: var(--surface-strong);
            border: 1px solid var(--glass-border);
        }

            .chat-search i {
                font-size: 14px;
                color: var(--muted);
            }

            .chat-search input {
                border: none;
                background: transparent;
                outline: none;
                width: 100%;
                font-size: 14px;
                color: var(--text);
            }

                .chat-search input::placeholder {
                    color: var(--muted-2);
                }

        /* CHAT ITEM */
        .chat-item {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background .2s;
        }

            .chat-item:hover,
            .chat-item.active {
                background: var(--neon);
            }

            .chat-item img {
                width: 42px;
                height: 42px;
                border-radius: 50%;
            }

            .chat-item .name {
                font-weight: 600;
                font-size: 14px;
            }

            .chat-item .last-msg {
                font-size: 13px;
                color: var(--muted);
            }

        /* ================================
                RIGHT CHAT AREA
                ================================ */
        .chat-area {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HEADER */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--glass-border);
            background: var(--surface-glass);
        }

        .chat-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .chat-user img {
                width: 42px;
                height: 42px;
                border-radius: 50%;
            }

        .chat-title .name {
            font-weight: 600;
            font-size: 15px;
        }

        .chat-title .status {
            font-size: 12px;
            color: var(--muted);
        }

        /* HEADER ICONS */
        .chat-actions {
            display: flex;
            gap: 16px;
        }

            .chat-actions i {
                font-size: 18px;
                cursor: pointer;
                color: var(--muted);
                transition: .2s;
            }

                .chat-actions i:hover {
                    color: var(--primary);
                }

        /* ================================
                CHAT MENU (THREE DOTS)
                ================================ */
        .chat-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 210px;
            background: white;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 999;
        }

        .menu-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            cursor: pointer;
        }


            .menu-item:hover {
                background: var(--neon);
            }

            .menu-item.danger {
                color: #dc3545;
            }

        .cursor-pointer {
            cursor: pointer;
        }

        /* ================================
                MESSAGES
                ================================ */
        .chat-messages {
            flex: 1;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        /* MESSAGE BUBBLES */
        .msg {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

            .msg.them {
                align-self: flex-start;
                background: var(--surface-strong);
            }

            .msg.me {
                align-self: flex-end;
                background: var(--primary);
                color: #fff;
            }

        /* ================================
                INPUT AREA
                ================================ */
        .chat-input {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid var(--glass-border);
            background: var(--surface-glass);
        }

            .chat-input input {
                flex: 1;
                border: none;
                outline: none;
                background: transparent;
                font-size: 14px;
                color: var(--text);
            }

        .chat-icon {
            font-size: 18px;
            cursor: pointer;
            color: var(--muted);
            transition: .2s;
        }

            .chat-icon:hover {
                color: var(--primary);
            }
        .chat-back {
            display: none;
            font-size: 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .messenger {
                flex-direction: column;
                justify-content: space-around;
            }

            .chat-list {
                width: 100%;
                height: 100%;
                border-right: none;
            }
            .chat-list.hide{
                display:none;
            }

            .chat-area {
                display: none; /* hidden until a chat is opened */
            }

                .chat-area.active {
                    display: flex;
                    width: 100%;
                    height: 100%;
                }
            .chat-back {
                display: inline-block;
            }
        }
        .msg-text {
            overflow-wrap: break-word; /* modern, preferred */
            word-wrap: break-word; /* older fallback */
            word-break: break-all; /* more aggressive (optional) */
        }
    </style>
</head>

        <script>

            AOS.init({ duration: 700, once: true });

            function getCookie(name) {
                let cookies = [];

                // Step 1: Check if any cookies exist
                if (document.cookie) {
                    // Step 2: Split cookie string into individual cookies
                    cookies = document.cookie.split('; ');
                }

                // Step 3: Go through each cookie
                for (let i = 0; i < cookies.length; i++) {
                    // Step 4: Split one cookie into [key, valueParts...]
                    const parts = cookies[i].split('=');
                    const key = parts[0];           // the cookie name
                    const valueParts = parts.slice(1); // everything after the first '='

                    // Step 5: If this cookie name matches the one we're looking for
                    if (key === name) {
                        // Step 6: Join value parts back together and decode
                        const value = valueParts.join('=');
                        return decodeURIComponent(value);
                    }
                }

                // Step 7: If no match found, return null
                return null;
            }

                            inner_html += html
                        });
                        search_profile_container.innerHTML = inner_html;
                        search_profile_container.style.display = "block";
                        document.querySelector(".profile-cards").style.display = "none";
                        
                        bind_events_card();
                    });
                })
            })
        </script>

    </body>
