    <style>
        :root {
            --primary: #0d6efd;
            /* general UI variables (will be overridden by body[data-theme]) */
            --bg: #0d1114;
            --surface-glass: rgba(255,255,255,0.06);
            --surface-strong: rgba(255,255,255,0.09);
            --muted: rgba(255,255,255,0.7);
            --muted-2: rgba(255,255,255,0.5);
            --neon: rgba(13,110,253,0.12);
            --glow: 0 0 10px rgba(13,110,253,0.6), 0 0 20px rgba(13,110,253,0.4);
            --text: #e6eef8;
            --glass-border: rgba(255,255,255,0.05);
            --card-shadow: 0 6px 30px rgba(2,6,23,0.6);
        }

        /* LIGHT THEME */
        body[data-theme='light'] {
            --bg: #ffffff;
            --surface-glass: rgba(15,23,42,0.03);
            --surface-strong: rgba(15,23,42,0.05);
            --muted: #6b7280; /* gray-500 */
            --muted-2: #9ca3af;
            --neon: rgba(13,110,253,0.06);
            --glow: 0 6px 18px rgba(2,6,23,0.06);
            --text: #1f2937;
            --glass-border: rgba(15,23,42,0.04);
            --card-shadow: 0 6px 24px rgba(15,23,42,0.06);
        }

        /* DARK THEME */
        body[data-theme='dark'] {
            --bg: linear-gradient(180deg,#071019 0%, #0d1114 100%);
            --surface-glass: rgba(255,255,255,0.04);
            --surface-strong: rgba(255,255,255,0.06);
            --muted: rgba(207,239,251,0.9);
            --muted-2: rgba(207,239,251,0.7);
            --neon: rgba(13,110,253,0.12);
            --glow: 0 0 12px rgba(13,110,253,0.65), 0 0 26px rgba(13,110,253,0.35);
            --text: #e6eef8;
            --glass-border: rgba(255,255,255,0.05);
            --card-shadow: 0 6px 30px rgba(2,6,23,0.6), var(--glow);
        }

        /* page basics */
        html, body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background .25s,color .25s;
        }

        .text-muted {
            color: var(--muted-2) !important;
        }

        /* scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(13,110,253,0.18);
            border-radius: 8px
        }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(13,110,253,0.32)
            }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--surface-glass);
            backdrop-filter: blur(8px);
            padding: 22px 12px;
            position: fixed;
            inset: 0 auto 0 0;
            box-shadow: var(--card-shadow);
            transition: width .28s ease, left .28s ease, box-shadow .28s ease;
            overflow-y: auto;
            border-right: 1px solid var(--glass-border);
        }

            .sidebar.collapsed {
                width: 72px;
            }

        .brand {
            font-weight: 700;
            font-size: 18px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .sidebar .nav-link {
            color: inherit;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all .22s ease;
            text-decoration: none;
        }

            .sidebar .nav-link .label {
                white-space: nowrap;
                transition: opacity .18s, transform .18s;
            }

        .sidebar.collapsed .nav-link .label {
            opacity: 0;
            transform: translateX(-10px);
            pointer-events: none;
        }

        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: var(--neon);
            color: var(--text);
            box-shadow: var(--glow);
        }

        .sidebar-toggle {
            position: absolute;
            top: 14px;
            right: -18px;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: var(--surface-strong);
            transition: transform .18s;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glow);
        }

        .sidebar.collapsed .sidebar-toggle {
            right: -14px;
            transform: rotate(180deg);
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            padding: 28px;
            transition: margin-left .28s ease;
        }

        .sidebar.collapsed + .main {
            margin-left: 72px;
        }

        /* GLASS CARDS */
        .glass {
            background: var(--surface-glass);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--glass-border);
            transition: box-shadow .2s ease, transform .2s ease;
        }

            .glass:hover {
                box-shadow: 0 10px 40px rgba(2,6,23,0.12), var(--glow);
            }

        /* PROJECT CARD hover */
        .project-card {
            transform-style: preserve-3d;
            transition: transform .45s cubic-bezier(.2,.9,.2,1), box-shadow .25s;
            overflow: hidden;
            border-radius: 12px;
            border: 0;
            background: transparent;
        }

            .project-card:hover {
                transform: translateY(-8px) rotateX(4deg) rotateY(6deg);
                box-shadow: var(--card-shadow);
            }

        /* chart container to avoid scrollbar & overflow issues */
        .chart-wrap {
            position: relative;
            height: 220px;
            overflow: hidden;
            border-radius: 10px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* small screens */
        @media (max-width:991px) {
            .sidebar {
                left: -300px;
            }

                .sidebar.show {
                    left: 0;
                }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .sidebar-toggle {
                display: none;
            }
        }

        /*theme toggle*/
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 30px;
            background: #e6e6e6;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            cursor: pointer;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background 0.4s;
        }

            .theme-toggle .icon {
                font-size: 14px;
                transition: color 0.4s;
                z-index: 2;
            }

                .theme-toggle .icon.sun {
                    color: #f1c40f;
                }

                .theme-toggle .icon.moon {
                    color: #666;
                }

            .theme-toggle .toggle-ball {
                position: absolute;
                width: 24px;
                height: 24px;
                background: white;
                border-radius: 50%;
                left: 4px;
                transition: all 0.4s ease;
                z-index: 1;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }

        body.dark-theme .theme-toggle {
            background: #333;
        }

            body.dark-theme .theme-toggle .icon.sun {
                color: #555;
            }

            body.dark-theme .theme-toggle .icon.moon {
                color: #f1c40f;
            }

        body.dark-theme .toggle-ball {
            transform: translateX(30px);
            background: #222;
        }
    </style>
</head>

        <script>
            delete_button = document.getElementById("deleteAccount");
            logout_button = document.getElementById("logoutBtn");

            logout_button.addEventListener("click", () => {
                localStorage.removeItem("profile");
                window.location.href = "/sign-in/";

            })


            delete_button.addEventListener("click", () => {
                showDeleteConfirmation(() => {
                    fetch(String(window.location.origin) + "/profile/", {
                        method: "DELETE",
                        headers: {

                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({ user_name: inputs[1].value, password: inputs[2].value })

                    }).then((response) => {
                        if (response.status === 200) {
                            let data = response.json();
                            data.then((data) => {
                                window.location.href = ""

                            });
                        }

                    });
                });
            });

            function showDeleteConfirmation(onconfirm) {
                const modal = document.getElementById('deleteConfirm');
                modal.classList.remove('d-none');

                document.getElementById('confirmYes').onclick = () => {
                    modal.classList.add('d-none');
                    onconfirm();
                };

                document.getElementById('confirmNo').onclick = () => {
                    modal.classList.add('d-none');
                    return false;
                };
            }

        <script>
            function update_profile(payload) {
                fetch(String(window.location.origin) + "/profile/", {
                    method: "PATCH",
                    headers: {
                        'Content-Type': "application/json",
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(payload)

                }).then((response) => {
                    if (response.status === 200) {
                        let data = response.json();
                        data.then((data) => {
                            console.log(data);
                            redirect_profile();

                        });
                    }

                });
            }
            const editBtn = document.getElementById("editProfileBtn");
            const inputs = [
                document.getElementById("displayName"),
                document.getElementById("username"),
                document.getElementById("password"),
            ];

            let isEditing = false;

            editBtn.addEventListener("click", () => {
                isEditing = !isEditing;

                inputs.forEach(input => {
                    input.readOnly = !isEditing;
                    input.classList.toggle("border-primary", isEditing);
                });

                editBtn.textContent = isEditing ? "Save" : "Edit";

                if (!isEditing) {
                    // 🔒 Place API call / save logic here
                    update_profile({
                        user_name: inputs[1].value,
                        first_name: inputs[0].value.split(" ")[0],
                        last_name: inputs[0].value.split(" ").slice(1).join(" "),
                        old_user_name: JSON.parse(localStorage.getItem("profile")).user_name,
                        password: inputs[2].value
                    });
                    localStorage.setItem("profile", JSON.stringify({ user_name: inputs[1].value, password: inputs[2].value }));

                    console.log("Saved values:", {
                        displayName: inputs[0].value,
                        username: inputs[1].value
                    });

                }
            });
            function getCookie(name) {
                let cookies = [];

                // Step 1: Check if any cookies exist
                if (document.cookie) {
                    // Step 2: Split cookie string into individual cookies
                    cookies = document.cookie.split('; ');
                }

                // Step 3: Go through each cookie
                for (let i = 0; i < cookies.length; i++) {
                    // Step 4: Split one cookie into [key, valueParts...]
                    const parts = cookies[i].split('=');
                    const key = parts[0];           // the cookie name
                    const valueParts = parts.slice(1); // everything after the first '='

                    // Step 5: If this cookie name matches the one we're looking for
                    if (key === name) {
                        // Step 6: Join value parts back together and decode
                        const value = valueParts.join('=');
                        return decodeURIComponent(value);
                    }
                }

                // Step 7: If no match found, return null
                return null;
            }
        </script>

        <script>

            function update_data(profile_data) {
                let displayname = document.getElementById("displayName");
                let username = document.getElementById("username");
                let password = document.getElementById("password");
                if (profile_data["active_notifications"] > 0)
                    document.querySelector(".notify-badge").innerHTML = profile_data["active_notifications"];
                else
                    document.querySelector(".notify-badge").classList.add("d-none");

                password.value = profile_data["password"];
                displayname.value = profile_data["first_name"] + " " + profile_data["last_name"]
                username.value = profile_data["user_name"];
                document.getElementById("lowerProfileName").innerText = profile_data["first_name"] + " " + profile_data["last_name"];
                document.getElementById("lowerjobTitle").innerText = profile_data["jobTitle"];
                if (profile_data["profile_picture"]) {
                    document.getElementById("lowerProfilePic").src = profile_data["profile_picture"]
                    document.getElementById("settingsProfilePic").src = profile_data["profile_picture"]
                }
                else {
                    document.getElementById("lowerProfilePic").src = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnSSxXHLqu5lsHYkFlZkvXuo2ZamNvdqLiCg&s'
                    document.getElementById("settingsProfilePic").src = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnSSxXHLqu5lsHYkFlZkvXuo2ZamNvdqLiCg&s'

                }



            }
            function redirect_profile() {
                if (localStorage.getItem("profile")) {
                    let profile = JSON.parse(localStorage.getItem("profile"));
                    profile.return_data = true
                    fetch(window.location.origin + "/redirect_profile/", {
                        method: "POST",
                        headers: {
                            'Content-Type': "application/json",
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify(profile)
                    }).then((response) => {
                        if (response.status == 200) {
                            let data = response.json()
                            data.then((data) => {
                                if (data["message"] == "Redirecting") {
                                    profile_data = data;
                                    console.log(profile_data);
                                    update_data(profile_data);
                                }
                                else if (data["message"] == "Email not verified") {
                                    window.location.href = "/Email-Verification/";
                                }
                                else if (data["message"] == "Incorrect Password" || data["message"] == "Incorrect Password or username") {
                                    window.location.href = "/sign-in/";

                                }
                                else {
                                    return false;
                                }
                            })

                        }
                    });
                }
                else {
                    window.location.href = "/sign-in/";

                }
            }
            redirect_profile();
            AOS.init({ duration: 700, once: true });
            let themeTogglebutton = document.getElementById("themeTogglebtn");
            themeTogglebutton.addEventListener('click', () => {
                const current = (body.getAttribute('data-theme') === 'light') ? 'light' : 'dark';
                applyTheme(current === 'light' ? 'dark' : 'light');
            });

        </script>
