{% extends 'pairs/base.html' %}

{% block title %}Login | Presentation Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-envelope-check-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Student Login</h3>
                    <p class="text-muted small">Enter your university email to receive a one-time verification code.</p>
                </div>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" id="email" class="form-control form-control-lg" 
                               placeholder="e.g. bsef26m501@pucit.edu.pk" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">
                        Send Verification Code
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
