<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card border-0 shadow-lg rounded-4 bg-white">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="rounded-circle bg-dark text-white d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                <i class="bi bi-shield-lock-fill fs-3"></i>
                            </div>
                            <h4 class="fw-bold">Instructor Portal</h4>
                            <p class="text-muted small">Enter special credentials to manage pairing</p>
                        </div>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger py-2 small">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" action="{% url 'custom_admin_login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Admin Username</label>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold small">Admin Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Access Admin Dashboard
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
