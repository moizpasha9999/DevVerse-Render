{% extends 'pairs/base.html' %}

{% block title %}Verify Code | Presentation Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Enter Verification Code</h3>
                    <p class="text-muted small">
                        We sent a 6-digit authentication code to <br>
                        <span class="fw-semibold text-dark">{{ email }}</span>
                    </p>
                </div>

                <form method="POST" action="{% url 'verify_otp' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <input type="text" name="otp" id="otp" class="form-control form-control-lg text-center fw-bold fs-4 tracking-wider" 
                               maxlength="6" placeholder="------" pattern="\d{6}" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">
                        Verify & Enter Portal
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="small text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i> Use a different email
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
